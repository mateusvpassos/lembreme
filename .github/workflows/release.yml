name: Release

# git tag v0.3.1 && git push origin v0.3.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # o pacote electron não baixa o binário no install; o build usa node_modules/electron/dist (electronDist)
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Instalador
        # numa tag o electron-builder tenta publicar sozinho; quem publica é o passo abaixo
        run: npm run dist -- --publish never
      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "Lembreme ${GITHUB_REF_NAME#v}" --generate-notes
          "dist/Lembreme-Setup-${GITHUB_REF_NAME#v}.exe"
